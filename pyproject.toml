[project]
name = "autocurser"
version = "0.1.0"
description = "Keyboard/mouse recording and playback tool for Windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "autoCurser" }]
keywords = ["automation", "keyboard", "mouse", "recording", "playback", "macro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "pyWinhook>=1.6.2",
    "pywin32>=302",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.scripts]
autocurser = "main:main"

[project.urls]
Homepage = "https://github.com/YC-CLT/autocurser"
Issues = "https://github.com/YC-CLT/autocurser/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "config.py", "engine", "cli", "tui"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
