[project]
name = "autocurser"
version = "0.1.0"
description = "Keyboard/mouse recording and playback tool for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyWinhook>=1.6.2",
    "pywin32>=302",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]